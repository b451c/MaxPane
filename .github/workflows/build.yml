name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
            artifact: reaper_maxpane-arm64.dylib
            build_file: reaper_maxpane.dylib
            cmake_flags: "-DCMAKE_OSX_ARCHITECTURES=arm64"
          - os: macos-14
            platform: darwin-x86_64
            artifact: reaper_maxpane-x86_64.dylib
            build_file: reaper_maxpane.dylib
            cmake_flags: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
          - os: windows-latest
            platform: win-x64
            artifact: reaper_maxpane-x64.dll
            build_file: Release/reaper_maxpane.dll
            cmake_flags: ""
          - os: ubuntu-latest
            platform: linux-x86_64
            artifact: reaper_maxpane-x86_64.so
            build_file: reaper_maxpane.so
            cmake_flags: ""
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
            artifact: reaper_maxpane-aarch64.so
            build_file: reaper_maxpane.so
            cmake_flags: ""

    runs-on: ${{ matrix.os }}
    continue-on-error: false
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v4

      - name: Clone REAPER SDK
        run: git clone --depth 1 https://github.com/justinfrankel/reaper-sdk.git cpp/sdk

      - name: Clone WDL
        run: git clone --depth 1 https://github.com/justinfrankel/WDL.git cpp/WDL

      - name: Create build directory
        shell: bash
        run: mkdir -p cpp/build

      - name: Configure (macOS / Linux)
        if: runner.os != 'Windows'
        working-directory: cpp/build
        run: cmake .. -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: cpp/build
        run: cmake .. -G "Visual Studio 17 2022" -A x64

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        working-directory: cpp/build
        shell: bash
        run: make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: cpp/build
        run: cmake --build . --config Release

      - name: Rename artifact
        working-directory: cpp/build
        shell: bash
        run: cp "${{ matrix.build_file }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cpp/build/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # macOS dylibs + Windows .dll are uploaded to the public Release.
      # Linux .so binaries stay as workflow artifacts on the Actions page
      # for internal smoke testing until #9 (Linux FX Browser close) is
      # cleared; they will join the public Release in v2.0.2.
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: reaper_maxpane-*.dylib

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: reaper_maxpane-x64.dll

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dylib
            artifacts/**/*.dll
          generate_release_notes: false
          body: |
            ## MaxPane ${{ github.ref_name }}

            Native C++ extension for REAPER — tiling window manager with tabs, workspaces, and drag-and-drop.

            ### Downloads

            | Platform | File | Status |
            |----------|------|--------|
            | macOS arm64 (Apple Silicon) | `reaper_maxpane-arm64.dylib` | ✅ Stable |
            | macOS x86_64 (Intel) | `reaper_maxpane-x86_64.dylib` | ✅ Stable |
            | Windows x64 | `reaper_maxpane-x64.dll` | ✅ Stable |

            > Linux build is available as a workflow artifact (Actions page) for internal smoke testing. It will be added to the public Release once smoke testing clears the FX Browser close blocker — see [#9](https://github.com/b451c/MaxPane/issues/9).

            ### Installation

            Copy the binary for your platform to your REAPER UserPlugins folder and restart REAPER.

            > macOS (arm64 + x86_64) and Windows x64 are fully functional. Linux is pending smoke-test clearance — see issue above. Please report any issues at [GitHub Issues](https://github.com/b451c/MaxPane/issues).

            See the full [CHANGELOG](https://github.com/b451c/MaxPane/blob/main/CHANGELOG.md) for version history.

